global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - "127.0.0.1:9090"

  - job_name: was-node
    static_configs:
      - targets:
          - "<arm1-private-ip>:9100"

  - job_name: upbit-clone-was
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "<arm1-private-ip>:8080"

  - job_name: db-node
    static_configs:
      - targets:
          - "<arm2-private-ip>:9100"

  - job_name: db-mysql
    static_configs:
      - targets:
          - "<arm2-private-ip>:9104"
